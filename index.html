<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMO Terengganu - Ambulans Siren Rush</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { text-align: center; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
    h1 { font-size: 22px; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); margin-bottom: 4px; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 15px; }

    /* GAME CANVAS */
    #gameCanvas { background: #334155; border: 3px solid #0284c7; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); touch-action: manipulation; max-width: 100%; cursor: pointer; }

    /* BUTANG UTAMA */
    .btn-view-all { width: 320px; padding: 12px; background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: 1px solid #38bdf8; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 15px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4); }

    /* BORANG SKOR DINAMIK */
    .form-container { margin-top: 15px; background: #1e293b; padding: 18px; border-radius: 12px; width: 320px; text-align: left; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
    label { font-size: 12px; color: #cbd5e0; margin-top: 6px; display: block; }
    input, select { width: 100%; padding: 9px; margin: 4px 0 8px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 13px; }
    button.btn-submit { width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 5px; }
    button.btn-retry { width: 100%; padding: 10px; background: #475569; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 8px; }

    /* POP-UP MODAL CARTA PENUH */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 999; justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 20px; width: 100%; max-width: 480px; max-height: 90vh; display: flex; flex-direction: column; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .modal-header h3 { color: #facc15; font-size: 17px; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; font-weight: bold; }

    /* PODIUM TOP 3 TERPERINCI */
    .podium-container { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin-bottom: 15px; width: 100%; height: 185px; }
    .podium { display: flex; flex-direction: column; align-items: center; justify-content: space-between; border-radius: 10px 10px 0 0; padding: 8px 4px; width: 32%; color: #0f172a; font-weight: bold; font-size: 11px; }
    .podium .score { font-size: 13px; font-weight: 800; background: rgba(255,255,255,0.3); padding: 2px 6px; border-radius: 10px; }
    .podium .name { font-size: 11px; line-height: 1.2; margin-top: 2px; text-align: center; color: #0f172a; font-weight: 800; word-break: break-word; }
    .podium .details { font-size: 9px; line-height: 1.1; margin-top: 2px; text-align: center; }

    .rank-1 { height: 170px; background: linear-gradient(135deg, #ffe066, #f59e0b); border: 2px solid #fbbf24; order: 2; }
    .rank-2 { height: 140px; background: linear-gradient(135deg, #e2e8f0, #94a3b8); border: 2px solid #cbd5e0; order: 1; }
    .rank-3 { height: 115px; background: linear-gradient(135deg, #fdba74, #b45309); border: 2px solid #f97316; order: 3; color: white; }
    .rank-3 .name { color: white; }

    .rank-list { text-align: left; background: #0f172a; border-radius: 8px; padding: 8px; overflow-y: auto; flex-grow: 1; max-height: 200px; }
    .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #1e293b; font-size: 12px; }
    .rank-num { font-weight: bold; color: #38bdf8; width: 28px; }
  </style>
</head>
<body>

  <h1>🚨 AMO Terengganu: Ambulans Siren Rush</h1>
  <p class="sub">Tap KIRI / KANAN skrin untuk tukar lorong! Elak lalu lintas & kumpul mata.</p>

  <canvas id="gameCanvas" width="320" height="420"></canvas>

  <button class="btn-view-all" onclick="openModal()">📜 Lihat Top 10 Carta Kedudukan</button>

  <!-- BORANG PENDAFTARAN DINAMIK -->
  <div class="form-container" id="scoreForm" style="display: none;">
    <h3 style="text-align: center; color: #facc15;">TAMAT MISION!</h3>
    <p style="text-align: center; font-size: 14px; margin-bottom: 10px;">Skor Akhir: <b id="finalScore" style="font-size: 20px; color: #f87171;">0</b> pts</p>
    
    <label>Nama Penuh / FB:</label>
    <input type="text" id="nama" placeholder="Ahmad Zaki" required>
    
    <label>No. WhatsApp:</label>
    <input type="tel" id="noTel" placeholder="0139876543" required>
    
    <label>Daerah / Negeri Asal:</label>
    <select id="daerah" onchange="tukarDaerah()" required>
      <option value="">-- Pilih Daerah / Luar Negeri --</option>
      <option value="Kuala Terengganu">Kuala Terengganu</option>
      <option value="Kuala Nerus">Kuala Nerus</option>
      <option value="Marang">Marang</option>
      <option value="Hulu Terengganu">Hulu Terengganu</option>
      <option value="Dungun">Dungun</option>
      <option value="Kemaman">Kemaman</option>
      <option value="Besut">Besut</option>
      <option value="Setiu">Setiu</option>
      <option value="Luar Terengganu">Luar Terengganu (Taip Negeri/Daerah)</option>
    </select>

    <div id="boxLuarTerengganu" style="display: none;">
      <label>Nyatakan Negeri / Daerah Anda:</label>
      <input type="text" id="daerahLuar" placeholder="Contoh: Kuantan, Pahang / Kota Bharu, Kelantan">
    </div>

    <label>Kategori:</label>
    <select id="kategori" onchange="tukarKategori()">
      <option value="Orang Awam">Orang Awam</option>
      <option value="Warga KKM">Warga KKM</option>
    </select>

    <div id="boxJawatan" style="display: none;">
      <label>Jawatan / Gelaran (Cth: AMO, Jururawat, Doktor, Farmasi):</label>
      <input type="text" id="jawatan" placeholder="Contoh: Penolong Pegawai Perubatan (AMO)">
    </div>

    <button class="btn-submit" onclick="hantarSkor()">Hantar Skor 🏆</button>
    <p id="statusMsg" style="margin-top: 8px; font-size: 12px; text-align: center; font-weight: bold;"></p>
    
    <button class="btn-retry" onclick="mulaGame()">🔄 Main Semula / Cuba Lagi</button>
  </div>

  <!-- POPUP LEADERBOARD TOP 10 -->
  <div class="modal-overlay" id="leaderboardModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🏆 Carta Top 10 Pemain</h3>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>

      <div class="podium-container">
        <div class="podium rank-2">
          <span>🥈 PERAK</span>
          <div class="name" id="p2-name">-</div>
          <div class="details"><span id="p2-daerah">-</span><br><b id="p2-kat">-</b></div>
          <div class="score" id="p2-score">0 pts</div>
        </div>
        <div class="podium rank-1">
          <span>👑 EMAS</span>
          <div class="name" id="p1-name">-</div>
          <div class="details"><span id="p1-daerah">-</span><br><b id="p1-kat">-</b></div>
          <div class="score" id="p1-score">0 pts</div>
        </div>
        <div class="podium rank-3">
          <span>🥉 GANGSA</span>
          <div class="name" id="p3-name">-</div>
          <div class="details"><span id="p3-daerah">-</span><br><b id="p3-kat">-</b></div>
          <div class="score" id="p3-score">0 pts</div>
        </div>
      </div>

      <h4 style="text-align: left; font-size: 12px; color: #94a3b8; margin-bottom: 6px;">Kedudukan #4 hingga #10:</h4>
      <div class="rank-list" id="rankList">
        <p style="text-align: center; color: #64748b; padding: 15px;">Memuatkan kedudukan...</p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // PASTE URL GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/a/macros/moh.gov.my/s/AKfycbwsr7L44KxQKzP4MJxOJxNy8XNqXhPbPe28vV9kF6alf8DTeQwTa1ZoN1xQWg2_wqA5ng/exec";

    const lanes = [53, 160, 267]; // 3 Lorong Utama
    let currentLane = 1; // Bermula di Lorong Tengah
    let playerY = 330;
    
    let obstacles = [];
    let items = [];
    let frame = 0;
    let score = 0;
    let speed = 3.2;
    let roadOffset = 0;
    let isInvincible = false;
    let invincibleTimer = 0;
    let gameOver = false;
    let gameStarted = false;

    const obsIcons = ['🚗', '🚛', '🛢️'];
    const itemIcons = ['🫀', '🚨', '🧰'];

    function createObstacle() {
      let lane = Math.floor(Math.random() * 3);
      let icon = obsIcons[Math.floor(Math.random() * obsIcons.length)];
      obstacles.push({ lane: lane, y: -40, icon: icon });
    }

    function createItem() {
      let lane = Math.floor(Math.random() * 3);
      let icon = itemIcons[Math.floor(Math.random() * itemIcons.length)];
      items.push({ lane: lane, y: -40, icon: icon, collected: false });
    }

    function update() {
      if (!gameStarted || gameOver) return;

      frame++;
      speed += 0.0008; // Kelajuan bertambah secara dinamik
      roadOffset = (roadOffset + speed) % 40;

      if (isInvincible) {
        invincibleTimer--;
        if (invincibleTimer <= 0) isInvincible = false;
      }

      // Penjana Objek
      if (frame % Math.max(35, Math.floor(90 / (speed * 0.4))) === 0) {
        if (Math.random() < 0.65) createObstacle();
        else createItem();
      }

      // Halangan
      for (let i = 0; i < obstacles.length; i++) {
        let obs = obstacles[i];
        obs.y += speed;

        if (obs.lane === currentLane && Math.abs(obs.y - playerY) < 35) {
          if (!isInvincible) {
            endGame();
          } else {
            obstacles.splice(i, 1);
            i--;
            score += 10;
          }
        } else if (obs.y > canvas.height + 40) {
          obstacles.splice(i, 1);
          i--;
        }
      }

      // Item / Power-Up
      for (let i = 0; i < items.length; i++) {
        let it = items[i];
        it.y += speed;

        if (!it.collected && it.lane === currentLane && Math.abs(it.y - playerY) < 35) {
          it.collected = true;
          if (it.icon === '🚨') {
            isInvincible = true;
            invincibleTimer = 180; // 3 saat kebal
            score += 30;
          } else {
            score += 20;
          }
        } else if (it.y > canvas.height + 40) {
          items.splice(i, 1);
          i--;
        }
      }

      score += 0.1;
    }

    function draw() {
      // Jalan Raya 3 Lorong
      ctx.fillStyle = "#334155";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Garisan Putus-Putus
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -roadOffset;

      ctx.beginPath();
      ctx.moveTo(106, 0); ctx.lineTo(106, canvas.height);
      ctx.moveTo(213, 0); ctx.lineTo(213, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Lukis Halangan
      for (let obs of obstacles) {
        ctx.font = "32px Arial";
        ctx.fillText(obs.icon, lanes[obs.lane] - 16, obs.y);
      }

      // Lukis Item
      for (let it of items) {
        if (!it.collected) {
          ctx.font = "28px Arial";
          ctx.fillText(it.icon, lanes[it.lane] - 14, it.y);
        }
      }

      // Lukis Ambulans (Pemain)
      ctx.font = "38px Arial";
      if (isInvincible && Math.floor(frame / 4) % 2 === 0) {
        ctx.shadowColor = "#facc15";
        ctx.shadowBlur = 15;
      }
      ctx.fillText("🚑", lanes[currentLane] - 19, playerY);
      ctx.shadowBlur = 0;

      // Dashboard Skor & Status Siren
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 15px Arial";
      ctx.fillText("Skor: " + Math.floor(score), 15, 30);

      if (isInvincible) {
        ctx.fillStyle = "#facc15";
        ctx.fillText("🚨 SIREN KEBAL AMBULANS!", 120, 30);
      }

      if (!gameStarted && !gameOver) {
        ctx.fillStyle = "#38bdf8";
        ctx.font = "bold 14px Arial";
        ctx.fillText("Tap KANAN / KIRI untuk tukar lorong!", 35, 200);
      }
    }

    function loop() {
      update();
      draw();
      if (gameStarted && !gameOver) requestAnimationFrame(loop);
    }

    function moveLeft() { if (currentLane > 0) currentLane--; }
    function moveRight() { if (currentLane < 2) currentLane++; }

    function handleInput(x) {
      if (!gameStarted && !gameOver) {
        mulaGame();
        return;
      }
      if (x < canvas.width / 2) moveLeft();
      else moveRight();
    }

    function mulaGame() {
      score = 0;
      frame = 0;
      speed = 3.2;
      currentLane = 1;
      obstacles = [];
      items = [];
      isInvincible = false;
      gameStarted = true;
      gameOver = false;
      document.getElementById("scoreForm").style.display = "none";
      document.getElementById("statusMsg").innerText = "";
      loop();
    }

    function endGame() {
      gameOver = true;
      gameStarted = false;
      document.getElementById("finalScore").innerText = Math.floor(score);
      document.getElementById("scoreForm").style.display = "block";
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") moveLeft();
      if (e.code === "ArrowRight" || e.code === "KeyD") moveRight();
      if (!gameStarted && e.code === "Space") mulaGame();
    });

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      let touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
      handleInput(touchX);
    });

    canvas.addEventListener("mousedown", (e) => {
      let mouseX = e.clientX - canvas.getBoundingClientRect().left;
      handleInput(mouseX);
    });

    function tukarDaerah() {
      let d = document.getElementById("daerah").value;
      document.getElementById("boxLuarTerengganu").style.display = (d === "Luar Terengganu") ? "block" : "none";
    }

    function tukarKategori() {
      let kat = document.getElementById("kategori").value;
      document.getElementById("boxJawatan").style.display = (kat === "Warga KKM") ? "block" : "none";
    }

    function openModal() { document.getElementById("leaderboardModal").style.display = "flex"; }
    function closeModal() { document.getElementById("leaderboardModal").style.display = "none"; }

    function loadLeaderboard() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          if (!data || data.length === 0) return;

          if (data[0]) { document.getElementById("p1-name").innerText = data[0].nama; document.getElementById("p1-daerah").innerText = data[0].daerah || "-"; document.getElementById("p1-kat").innerText = (data[0].kategori === "Warga KKM") ? data[0].jawatan : "Orang Awam"; document.getElementById("p1-score").innerText = data[0].score + " pts"; }
          if (data[1]) { document.getElementById("p2-name").innerText = data[1].nama; document.getElementById("p2-daerah").innerText = data[1].daerah || "-"; document.getElementById("p2-kat").innerText = (data[1].kategori === "Warga KKM") ? data[1].jawatan : "Orang Awam"; document.getElementById("p2-score").innerText = data[1].score + " pts"; }
          if (data[2]) { document.getElementById("p3-name").innerText = data[2].nama; document.getElementById("p3-daerah").innerText = data[2].daerah || "-"; document.getElementById("p3-kat").innerText = (data[2].kategori === "Warga KKM") ? data[2].jawatan : "Orang Awam"; document.getElementById("p3-score").innerText = data[2].score + " pts"; }

          let rankListHTML = "";
          for (let i = 3; i < data.length; i++) {
            let labelJawatan = (data[i].kategori === "Warga KKM") ? data[i].jawatan : "Awam";
            rankListHTML += `
              <div class="rank-item">
                <span class="rank-num">#${i + 1}</span>
                <span><b>${data[i].nama}</b> (${data[i].daerah || 'Luar Terengganu'}) - <i style="font-size:11px; color:#cbd5e0;">${labelJawatan}</i></span>
                <span style="color: #facc15; font
